[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepafact"
version = "0.1.0"
description = "Multilingual factuality and robustness benchmark for Nepal-focused AI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.0", "plotly>=5.20"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["nepafact*"]
